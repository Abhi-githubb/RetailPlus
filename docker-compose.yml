version: '3.8'

services:
  # PostgreSQL 16 Production Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: retailpulse_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailpulse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-RetailPulse2025Secret!}
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse_warehouse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailpulse_admin} -d ${POSTGRES_DB:-retailpulse_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI REST API Analytics Backend
  api:
    build: .
    container_name: retailpulse_api
    restart: always
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://retailpulse_admin:RetailPulse2025Secret!@postgres:5432/retailpulse_warehouse
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Streamlit SaaS Interactive Dashboard
  dashboard:
    build: .
    container_name: retailpulse_dashboard
    restart: always
    command: streamlit run app/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      DATABASE_URL: postgresql://retailpulse_admin:RetailPulse2025Secret!@postgres:5432/retailpulse_warehouse
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
