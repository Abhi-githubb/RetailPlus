# Render Cloud Deployment Blueprint for RetailPulse
# Documentation: https://render.com/docs/blueprint-spec

services:
  # FastAPI REST API Service
  - type: web
    name: retailpulse-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python run_pipeline.py
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: retailpulse-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: retailpulse-postgres
    plan: free
    region: oregon
    databaseName: retailpulse_db
    user: retailpulse_user
